services:
  unifi-security:
    build: .
    image: unifi-security-console:local
    container_name: unifi-security-console
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      # Development build: this machine only. Use "8787:8787" to reach it from your network (by IP address or a
      # local name; a domain behind a reverse proxy goes in ALLOWED_HOSTS). Create your account first.
      - "127.0.0.1:8787:8787"
    volumes:
      - usc-data:/data

volumes:
  usc-data:
